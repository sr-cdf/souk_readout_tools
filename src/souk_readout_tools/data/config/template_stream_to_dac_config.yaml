# ============================================================================
# SOUK Readout Tools — stream-to-dac Configuration Template
# ============================================================================
# Configuration for the souk-stream-to-dac client script: live stream ->
# IQ->x conversion -> analog DAC output. Copy this file and edit it.
# Every experimental parameter that is not yet pinned down (TOPTICA analog
# input range, logging rate, LabJack model, monitor/trigger lines) is a
# config option here — see the table in doc/stream_to_dac.md.
#
# This file is separate from (and does not modify) the readout config schema.
# Run:  souk-stream-to-dac --config my_stream_to_dac.yaml -a <addr> -r <port>
# ============================================================================

# --- Readout server connection ---
# Either a path to a local readout config file, or an address/request_port
# pair (the running config is then pulled from the remote server). The
# -C/-a/-r command-line arguments override these.
connection:
  config_file: null
  address: null
  request_port: null

# --- IQ -> x conversion ---
# mode:
#   magnitude     |IQ| in raw counts (zero-calibration first-light mode)
#   phase         phase relative to a reference IQ point, in rad
#   df_modelfree  -phase / dphi_df, the resonance shift in Hz (needs dphi_df,
#                 the raw phase slope; reads some loss as frequency)
#   df_calibrated a fixed tone through the resonator conversions: `output`
#                 by `method` (default: exact Mobius inversion). Needs a
#                 calibration: calibration_file, or one pushed to the server
#                 with client.set_resonator_calibrations (then no file).
#   ffm           live three-point demodulation: needs frequency modulation
#                 running (enable_modulation + enable_stream). Each cycle
#                 measures its own phase slope; with a calibration (file or
#                 pushed) the conversion runs in the centred basis, else on
#                 raw I/Q. Tracking recentres are followed through the
#                 per-revision state in the typed tone-update frames
#                 (subscribed automatically).
# output: what x is, a resonator.QUANTITIES name (df_calibrated and ffm):
#   resonance_shift_hz (default; positive = resonance moved up),
#   resonance_frequency_hz, detuning_hz (resonance - tone),
#   matched_dissipation_shift (Delta(1/2Qi)), *_linewidths variants, ...;
#   ffm also offers center_detuning_hz, center_detuning_linewidths, dphi_df.
#   The old 'frequency' is resonance_shift_hz and 'dissipation' is
#   matched_dissipation_shift.
# method: df_calibrated only -- mobius, phase, linearized, lookup or circle
#   (linearized and lookup need a calibration file saved with its sweep).
# demod_method: ffm only -- fast (the tracker's finite differences) or
#   accurate (quadratic fit of phase against offset).
# reference_iq: [I, Q] reference point for the phase modes; null captures
#   the average of reference_samples stream samples at startup instead.
# average_cycles / baseline_cycles: ffm only -- boxcar over the last N
#   per-cycle outputs, and cycles averaged into the startup reference.
conversion:
  mode: magnitude
  reference_iq: null
  reference_samples: 100
  dphi_df: null            # rad/Hz, for df_modelfree
  calibration_file: null   # .npz from resonator.save_calibrations
  output: resonance_shift_hz
  method: mobius           # df_calibrated
  demod_method: fast       # ffm
  average_cycles: 1        # ffm: boxcar over per-cycle outputs
  baseline_cycles: 20      # ffm: startup reference cycles

# --- Output channels ---
# One entry per DAC channel. Select the tone by user-order index
# (tone_index) or by frequency (tone_frequency_hz resolves to the nearest
# active tone). The df->volts mapping per channel is
#   volts = clip(gain * (x - x_offset) + v_offset, v_min, v_max)
# where x is the converter output (counts / rad / Hz depending on mode).
# Match v_min/v_max to the TOPTICA analog input range once known. With an
# LJTick-DAC (+/-10 V) use e.g. dac_channel: TDAC0 and v_min: -10.0. On the
# alsa backend the range is symmetric about zero (v_min: -1.0, v_max: 1.0 for
# a 1 V full scale) and v_offset does nothing -- the coupling capacitor blocks
# any standing offset. Channel names DAC0/DAC1 map to the first two audio
# channels, so a LabJack config ports over unchanged.
channels:
  - dac_channel: DAC0
    tone_index: 0
    tone_frequency_hz: null
    gain: 1.0
    x_offset: 0.0
    v_offset: 0.0
    v_min: 0.0
    v_max: 5.0
  # - dac_channel: DAC1     # optional second tone
  #   tone_index: 1
  #   gain: 1.0
  #   x_offset: 0.0
  #   v_offset: 0.0
  #   v_min: 0.0
  #   v_max: 5.0

# --- DAC backend ---
# backend:
#   'labjack'      LabJack T4/T7 via labjack-ljm; channels DAC0/DAC1 (0-5 V),
#                  TDAC0.. (LJTick-DAC, +/-10 V). Keep update_rate_hz in the
#                  low hundreds of Hz.
#   'labjack_u12'  LabJack U12 via LabJackPython + the Exodriver
#                  (liblabjackusb); outputs AO0/AO1 (0-5 V only; DAC0/DAC1
#                  accepted as aliases), inputs AI0..AI7 (AIN0.. aliased).
#                  Measured: ~16 ms/transaction (~62 writes/s); a tick that
#                  also samples ain_channels adds another ~16 ms (~31/s). Keep
#                  update_rate_hz <= 50 (output-only) or <= 25 (with AIN).
#   'alsa'         a sound card via pyalsaaudio. LINUX ONLY -- on Windows and
#                  macOS this falls back to the dummy backend; use a LabJack
#                  there. (sudo apt install libasound2-dev; pip install
#                  pyalsaaudio.) Cheap, fast and
#                  multichannel, but line outputs are AC-COUPLED: they cannot
#                  hold a DC level, and everything below the coupling corner
#                  is high-passed. Run --selftest to measure that corner and
#                  full_scale_volts before trusting a slow scan; see
#                  doc/stream_to_dac.md. A DC-coupled interface (Expert
#                  Sleepers ES-8/ES-9, MOTU) works with the same backend.
#   'dummy'        no hardware; also the automatic fallback when the selected
#                  LabJack or ALSA driver is not installed.
# update_rate_hz: DAC updates per second. USB command-response writes cost
#   ~1 ms (T-series) to ~20 ms (U12) each. The stream is boxcar-averaged over
#   N = round(sample_rate / update_rate_hz) samples per update.
# idle_voltage: safe-state voltage driven on every channel on exit/error.
# ain_channels: analog inputs sampled once per output update and logged
#   with host time + nearest frame tt — reserved for a future TOPTICA
#   frequency-monitor or step-trigger line. Empty list disables.
# labjack: driver options for the selected LabJack backend (keys differ by
#   backend, see below). Ignored for the dummy and alsa backends.
# alsa: driver options for backend: alsa. Ignored otherwise.
#   device: ALSA PCM name. Prefer an explicit 'hw:' device -- it bypasses
#     PipeWire/PulseAudio volume and resampling, both of which would sit
#     inside the voltage calibration. --list-audio-devices prints the choices.
#   period_size: frames per ALSA period. Set it to about rate/update_rate_hz
#     so each output update is ramped across one period instead of stepped.
#   full_scale_volts: output volts at digital full scale, measured with
#     --selftest. The mixer gain is inside this number, so set the mixer once
#     and then leave it alone.
dac:
  backend: dummy
  update_rate_hz: 200.0
  idle_voltage: 0.0
  labjack:                 # T-series (backend: labjack):
    device_type: ANY       #   ANY / T4 / T7
    connection_type: ANY   #   ANY / USB / ETHERNET
    identifier: ANY        #   serial number, IP address, or ANY
    # U12 (backend: labjack_u12) uses these instead — delete the three above:
    # id: -1               #   local device id; -1 opens the first U12 found
    # serial_number: null  #   open a specific device by serial (null = any)
  alsa:                    # sound card (backend: alsa):
    device: default        #   e.g. hw:CARD=PCH,DEV=0 (see --list-audio-devices)
    rate: 48000            #   sample rate, Hz
    channels: 2            #   audio channels to open (most cards refuse mono)
    period_size: 256       #   frames per period; ~= rate / update_rate_hz
    full_scale_volts: 1.0  #   volts at digital full scale; measure it first
  ain_channels: []         # e.g. [AIN0] (T-series) or [AI0] (U12); the alsa
                           # backend always reads zeros (no capture path)

# --- Stream handling ---
# queue_depth: reader->output queue depth in frames; bounds the worst-case
#   staleness at queue_depth / sample_rate on top of the averaging window.
#   null (default) uses max(8, 2 * N) where N is the boxcar length.
# watchdog_s: exit to safe state when no frame arrives for this long.
# apply_readout_correction: apply the same software readout-flattening
#   factors as parse_samples(apply_readout_correction=True) so stream IQ
#   matches the units of parsed sweep data (identity when not modulated).
# subscribe_updates: opt in to the server's typed tone-update frames and
#   log them to <recording>.updates.jsonl (tone provenance; needs a server
#   with typed-frame support, see doc/tone_tracking.md).
stream:
  queue_depth: null
  watchdog_s: 5.0
  apply_readout_correction: true
  subscribe_updates: false

# --- Recording ---
# The raw stream is always recorded (same file + JSON-sidecar format as
# souk-receive-stream, readable by the existing tooling, replayable with
# --replay). Set filename to null to disable. ain_log overrides the AIN
# CSV path (default <directory>/<filename>.ain.csv).
recording:
  directory: ./tmp
  filename: stream_to_dac
  ain_log: null

# Seconds between status lines (0 disables; --quiet also disables).
status_interval_s: 1.0
