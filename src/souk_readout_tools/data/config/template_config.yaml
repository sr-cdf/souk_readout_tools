# ============================================================================
# SOUK Readout Tools — Configuration Template
# ============================================================================
# Copy this file and edit it to match your system setup.
#
# Use copy_template_config() to create a new config file:
#   from souk_readout_tools.config_utils import copy_template_config
#   copy_template_config('my_config.yaml', pipeline_id=0)
#
# ============================================================================

config:
  config_id: "New config from template"
  created_by: "Automatically generated from template_config.yaml"
  creation_date: "2024-08-29"
  comments: "This config file is a template and should be updated to reflect the actual configuration."

# --- RFSoC host connection settings ---
# address: IP address of the RFSoC board
# request_port / stream_port: offset by pipeline_id (e.g. pipeline 0 = 10000, pipeline 1 = 10001)
rfsoc_host:
  hardware_id: "unnamed_rfsoc"
  address: "10.11.11.11"
  request_port: 10000
  stream_port: 20000
  comments:

# --- Firmware and RFDC settings ---
# These settings must match the loaded firmware and RFDC tile/block mapping.
# The default values are for dual-pipeline firmware on pipeline 0.
firmware:
  fw_config_file: "/home/casper/souk-firmware/software/control_sw/config/souk-dual-pipeline-krm.yaml"
  pipeline_id: 0
  # clock_source: 'internal' for on-board 12.8 MHz oscillator, 'external' for 10 MHz reference on clk0.
  # This is a board-level setting — both pipeline configs should specify the same value.
  clock_source: "internal"
  # trigger_source_pin: GPIO pin index used for the external trigger input.
  trigger_source_pin: 0
  # RFDC tile/block mapping — must match the firmware configuration:
  #   Pipeline 0: DACs {0/0} and {0/2}, ADC {2/0}
  #   Pipeline 1: DACs {1/0} and {1/2}, ADC {3/0}
  dac0_tile: 0
  dac0_block: 0
  dac1_tile: 0
  dac1_block: 2
  adc_tile: 2
  adc_block: 0
  dac_fullscale_bits: 16
  adc_fullscale_bits: 16
  dac_physical_bits: 14
  adc_physical_bits: 14
  # Conversion factors between digital full-scale (dBFS) and analog power (dBm).
  # These can be scalar values or paths to CSV calibration files.
  dac0_dbfs_to_dbm: -6.0
  dac1_dbfs_to_dbm: -6.0
  adc_dbm_to_dbfs: +12
  vop_current_fullscale: 20000
  defaults:
    # sync_delay is intentionally omitted. As of firmware v7.11 it is deprecated:
    # the mixer owns the RX/TX delay and sets it automatically during init
    # (mixer.set_rx_sync_delay + buffer-switch skew match). A sync_delay set here
    # is ignored (the server warns), so do not add it back.
    acc_len: 1000
    internal_loopback: false
    psb_scale: 1
    psb_fftshift: 0b00000011111111
    pfb_fftshift: 0b00000011111111
    nyquist_zone: 1                   # Sets DAC/ADC mixer frequencies automatically to +/-2*adc_clk_hz/4 (zone 1) or +/-2*adc_clk_hz*3/4 (zone 2)
    dac_inverse_sinc_filter_enabled: true  # Compensate DAC sinc roll-off using the filter mode for the configured Nyquist zone (~3dB gain at high frequencies)
    # Filterbank channel-response compensation (doc/filterbank_compensation.md):
    # corrects the DPSS+sinc rolloff/ripple for tones operating away from their
    # bin centre (modulation riding the channel overlap; snap residuals). The
    # phase term's group delay comes from rf_frontend.path_group_delay_ns,
    # evaluated per tone.
    filterbank_compensation: true
    # filterbank_group_delay_override_ns: 0  # TESTING/LOOPBACK ONLY: overrides
    #   the path_group_delay_ns calibration for the compensation phase term
    #   (e.g. force 0 for an amplitude-only A/B in loopback). Leave unset for
    #   normal operation.
    dsa: 0
    vop: 20000                       # WARNING: not rated above 20000uA in gen3 with 2.5V V_dac_vtt; up to 40500uA adds nonlinearity
    # dac_duc_mixer_frequency_hz: 1228800000   # Not needed when nyquist_zone is set (it overrides these)
    # adc_ddc_mixer_frequency_hz: -1228800000  # Not needed when nyquist_zone is set (it overrides these)
    dac_mixer_scale_1p0: false       # WARNING: using 1p0 may add nonlinearity
    adc_mixer_scale_1p0: false       # WARNING: using 1p0 may add nonlinearity
    dac_qmc_gain: 1                  # WARNING UNTESTED. Gain correction factor. Range: 0 to 2.0 (Exclusive)
    dac_qmc_offset: 0               # WARNING UNTESTED. Offset correction factor (fixed LSB value added to signal)
    dac_qmc_phase: 0                # WARNING UNTESTED. Phase correction factor. Range: +/- 26.5 degrees (Exclusive)
    adc_qmc_gain: 1                  # WARNING UNTESTED. Gain correction factor. Range: 0 to 2.0 (Exclusive)
    adc_qmc_offset: 0               # WARNING UNTESTED. Offset correction factor (fixed LSB value added to signal)
    adc_qmc_phase: 0                # WARNING UNTESTED. Phase correction factor. Range: +/- 26.5 degrees (Exclusive)
    # Regular tone defaults. Blind monitor tones are configured separately
    # below and are appended after these entries in the active firmware tone
    # list.
    frequencies: []
    amplitudes: []
    phases: []
    # Blind tones are ordinary firmware tones used for off-resonance gain/phase
    # monitoring. Power/VACC/PAPR calculations include them, sweeps include
    # them, and retune/tracking logic keeps them fixed at these centers.
    blind_frequencies: []
    blind_amplitudes: []
    blind_phases: []
    blind_spans: []                  # Optional sweep spans for blind tones; defaults to the requested regular-tone sweep span.
  # GPIO pin assignments
  gpio_0: 'trigger_input'
  gpio_1: 'misc_input'
  gpio_2: 'misc_input'
  gpio_3: 'misc_input'
  gpio_4: 'nc'
  gpio_5: 'nc'
  gpio_6: 'new_accumulation_pulse_output'
  gpio_7: 'pps_input'
  comments:

# --- RF Frontend ---
# Describes the RF signal chain between the RFSoC and the cryostat.
# Set 'connected: true' to include RF frontend calibration corrections and,
# for controllable backends, RF peripheral control.
rf_frontend:
  connected: true
  hardware_id: "module1"             # unique name of this physical RF frontend
                                     # (e.g. "module1" or "souk-mixerless-module-01");
                                     # surfaced in get_info, server logs, calibration files

  # --- SOUK mixerless module hardware settings ---
  # Set connected: true if the active RF frontend IS a SOUK mixerless module
  # (which exposes both i2c attenuators and bypass amps). Set connected: false
  # for non-mixerless RF frontends (e.g. a RUDAT bench setup).
  mixerless_module:
    connected: true
    rf_channel: 0                    # module channel (0 or 1); copy_template_config()
                                     # sets this to match firmware.pipeline_id by default
    # Optional measured mixerless-module calibration overrides.
    # S21 values use the standard calibration formats:
    #   scalar, [[freq_hz, dB], ...], or "filename.csv".
    # These override the built-in component model when set. The *_delta_s21_db
    # keys are bypassed-minus-enabled S21, useful when only the bypass change
    # is measured. Prefer absolute enabled/bypassed S21 values when available.
    tx_amp_enabled_s21_db:
    tx_amp_bypassed_s21_db:
    tx_amp_bypass_delta_s21_db:
    rx_amp_enabled_s21_db:
    rx_amp_bypassed_s21_db:
    rx_amp_bypass_delta_s21_db:
    # Input-referred 1 dB compression points for the mixerless-module path.
    # If unset, the wrapper uses the component model as a fallback.
    tx_input_1db_comp_dbm:
    rx_input_1db_comp_dbm:
    # Optional module-only group delay. Full path deembedding still uses
    # rf_frontend.path_group_delay_ns.
    tx_group_delay_ns:
    rx_group_delay_ns:

  # --- Attenuator control ---
  # backend: i2c   uses the SOUK mixerless module's on-board attenuators
  #                (requires mixerless_module.connected: true above)
  # backend: rudat uses Mini-Circuits RUDAT USB attenuators
  # backend: fixed uses the tx/rx values below as fixed, non-controllable
  #                attenuation values (explicit manual attenuator mode)
  attenuator:
    backend: "i2c"
    tx_value_db: 30.0
    rx_value_db: 30.0
    # --- Example RUDAT configuration (only used if backend: rudat) ---
    # rudat_tx_serial: "12345"        # serial number of TX RUDAT attenuator
    # rudat_rx_serial: "12346"        # serial number of RX RUDAT attenuator
    rudat_tx_serial:
    rudat_rx_serial:

  # --- Bypassable amplifier controls ---
  # Available on the SOUK mixerless module. Set enabled: true to allow
  # software control of the TX/RX amplifier bypass state.
  bypass_amps:
    enabled: true
    tx_amp_bypass: true
    rx_amp_bypass: true

  # --- RF path characterisation ---
  # These values describe the gain/loss of each component in the signal chain.
  # Each can be a scalar (dB), a [freq_hz, dB] array, or a path to a CSV file.
  #
  # path_group_delay_ns: full TX+RX round-trip group delay (cable delay).
  #   Used by resonator fitting and deembedding to seed the phase-slope
  #   estimate instead of relying on auto-detection from the S21 phase, and
  #   by the filterbank compensation (evaluated per tone) to correct the image
  #   phase turn-over near channel edges when modulating.
  #   Formats accepted:
  #     scalar        — constant delay in nanoseconds, e.g. 120.5
  #     [[f, tau], …] — frequency-dependent pairs: freq in Hz, delay in ns
  #     "filename.csv"— path to a two-column CSV (freq_hz, tau_ns); treated
  #                     as a calibration file and transferred with push/pull.
  #   Measure with client.measure_path_group_delay().
  path_group_delay_ns:
  tx_combiner_loss_db:
  rx_combiner_loss_db:
  tx_if_s21_db:
  rx_if_s21_db:
  tx_rf_s21_db:
  rx_rf_s21_db:
  tx_mixer_conversion_loss_db:
  rx_mixer_conversion_loss_db:
  tx_mixer_lo_frequency_hz:
  rx_mixer_lo_frequency_hz:
  tx_mixer_sideband:
  rx_mixer_sideband:
  loopback: false

  comments:

# --- Cryostat ---
# Describes the cryostat and its RF connections.
cryostat:
  # Controls whether cryostat RF S21 terms are included in the calibration
  # chain. LNA bias control is independent; use lna_bias.enabled below.
  connected: false
  cryostat_id:
  input_channel_id:
  output_channel_id:
  input_s21_db:
  output_s21_db:
  lna_model:

  # --- LNA bias control ---
  # Controls/describes the cryostat LNA bias.
  # This can be enabled even when cryostat.connected is false.
  # There are 14 LNA channels per cryostat (indices 1-14).
  # Set lna_channel to the LNA index that this readout pipeline is connected to.
  # backend: i2c   uses the SOUK LNA bias board on the RFSoC I2C bus
  # backend: fixed records a fixed, non-controllable bias value
  lna_bias:
    enabled: true
    backend: "i2c"
    lna_channel: 1                   # LNA index (1-14) for this readout pipeline
    bias_voltage_v: 1.5              # applied on config push/apply when enabled
    soft_off: false                  # true drives channel to min local voltage; not a hard power cut
    method: "local"                 # 'remote' feedback or 'local' DAC set
    blind: false                     # remote method only; skip LNA-voltage sanity check
    i2c:
      bus: 0                         # LNA bias board is always on SMBus(0), independent of pipeline_id

  thermometry_log_file:
  optical_setup:
  filter_stack:
  comments:

# --- Detector ---
# Describes the MKID detector array.
detector:
  connected: false
  chip_id:
  channel_id:
  box_id:
  resonance_frequencies_file:
  drive_powers_file:
  detector_layout_file:
  comments:
