# systemd drop-in for chrony.service: start chrony only after ptp4l has set the PHC.
# Installed to /etc/systemd/system/chrony.service.d/ by install_timing_services.sh.
#
# Why this is needed
# ------------------
# The board has no battery-backed clock, so it boots with a wrong date (on
# 2026-10-08 krm4-mcr came up at Nov 2025), and so does the PHC. ptp4l only steps
# the PHC to the grandmaster's time once it has picked a master (UNCALIBRATED, ~40 s
# after boot). chrony starts earlier, as soon as the network is up, and polls PHC0
# every second. If chrony takes PHC0 samples before ptp4l's step, it races:
#
#   45.6 s  chrony selects PHC0 from the stale, pre-step samples
#   46.2 s  ptp4l reaches SLAVE: the PHC has just jumped by ~316 days
#   46.7 s  chrony sees PHC0 jump, marks it a falseticker and selects NTP
#
# The system clock still ends up at the right time (NTP steps it), but the jump
# stays in chrony's statistics for PHC0, so PHC0 shows as unusable ('#?', error of
# thousands of minutes) and Linux time runs on internet NTP (~ms, wandering) instead
# of PTP (~us) until chrony is restarted. It is intermittent: whether chrony loses
# the race depends on boot timing (krm4-cdf won it on the same day).
#
# "makestep" does not help: chrony did step both times; it is the falseticker
# verdict and the poisoned statistics that keep the PHC out.
#
# What this does
# --------------
# Holds chrony back until ptp4l reports portState SLAVE, i.e. after the PHC has been
# stepped, so chrony's first PHC0 sample is already right. With no grandmaster it
# gives up after 90 s and starts chrony anyway: chrony then rejects the free-running
# PHC and uses NTP, as before.
#
# Prefixes on ExecStartPre: '-' means a failure here never stops chrony starting.
# '+' runs this one command as root outside chrony's sandbox. It is required:
# chrony.service sets User=_chrony and ProtectSystem=strict etc., and without '+'
# pmc runs as _chrony, cannot open ptp4l's root-owned socket ("uds: bind failed:
# Permission denied") and the loop always waits the full 90 s (seen on krm4-mcr,
# 2026-10-08). chronyd itself keeps its sandbox; its ExecStart has its own '!'.
#
# Recovery without a reboot, if PHC0 is ever stuck unusable: sudo chronyc reset sources
# (or sudo systemctl restart chrony).

[Unit]
After=ptp4l.service
Wants=ptp4l.service

[Service]
ExecStartPre=-+/bin/sh -c 'for i in $(seq 90); do /usr/sbin/pmc -u -b 0 "GET PORT_DATA_SET" 2>/dev/null | grep -q "portState *SLAVE" && exit 0; sleep 1; done; echo "ptp4l not SLAVE after 90 s; starting chrony anyway (PHC will be rejected, NTP used)"'
# The default 90 s start timeout would kill chrony at the end of the wait.
TimeoutStartSec=150
