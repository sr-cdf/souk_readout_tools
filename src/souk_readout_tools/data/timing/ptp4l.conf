[global]
# SOUK RFSoC slave-side linuxptp configuration.
#
# This default targets the RFSoC GEM interface on a standard IEEE 1588 L2
# multicast network using hardware timestamps. Match domainNumber,
# network_transport, and delay_mechanism to the site grandmaster/profile.

clientOnly              1
twoStepFlag             1
domainNumber            0
clockClass              248
clockAccuracy           0xFE
offsetScaledLogVariance 0xFFFF
dataset_comparison      ieee1588
maxStepsRemoved         255

logAnnounceInterval     1
logSyncInterval         0
logMinDelayReqInterval  0
announceReceiptTimeout  3

clock_class_threshold   248
kernel_leap             1
first_step_threshold    0.00002
clock_servo             pi

uds_address             /var/run/ptp4l
uds_file_mode           0660
uds_ro_address          /var/run/ptp4lro
uds_ro_file_mode        0666

clock_type              OC
network_transport       L2
delay_mechanism         E2E
time_stamping           hardware
tsproc_mode             filter
delay_filter            moving_median
delay_filter_length     10
phc_index               -1

# If the grandmaster does not assert currentUtcOffsetValid, linuxptp can use
# this as a fallback. Prefer a production GM that announces validity.
# utc_offset            37
