# Chrony refclock drop-in for RFSoC PTP Hardware Clock.
#
# Offset -37:
#   ptp4l keeps the PHC on the PTP timescale (TAI), which runs currentUtcOffset
#   (37 s) ahead of UTC. chrony does not read that offset from ptp4l, so the
#   refclock applies it to put PHC0 on UTC (the PHC example in chrony.conf(5)).
#   Use offset 0 only for a grandmaster serving the ARB timescale
#   (ptpTimescale 0 in pmc 'GET TIME_PROPERTIES_DATA_SET'). Set it with:
#     souk-enable-timing --offset=SECONDS
#
# Use "prefer" so PHC wins when it agrees with real time, but do not mark it as
# "trust". If the board starts with no PTP GM and the PHC epoch is wrong, chrony
# must be allowed to reject PHC and select NTP instead.
# /dev/ptp-end0 is end0's PHC under a name that survives renumbering
# (90-ptp-end0.rules); /dev/ptpN changes on every ifdown/ifup.
refclock PHC /dev/ptp-end0 poll 0 dpoll -2 offset -37 prefer

# Allow timing-monitor to query chrony locally.
bindcmdaddress 127.0.0.1
bindcmdaddress ::1
