# Chrony refclock drop-in for RFSoC PTP Hardware Clock.
#
# Default:
#   Use offset 0 for a production grandmaster that asserts UTC correctly.
#
# Lab workaround:
#   The current software grandmaster serves TAI-like PHC time but does not
#   assert currentUtcOffsetValid, so the lab setup needs offset -37 to keep
#   CLOCK_REALTIME aligned to UTC. Install with:
#     souk-enable-timing --offset=-37
#
# Use "prefer" so PHC wins when it agrees with real time, but do not mark it as
# "trust". If the board starts with no PTP GM and the PHC epoch is wrong, chrony
# must be allowed to reject PHC and select NTP instead.
# /dev/ptp-end0 is end0's PHC under a name that survives renumbering
# (90-ptp-end0.rules); /dev/ptpN changes on every ifdown/ifup.
refclock PHC /dev/ptp-end0 poll 0 dpoll -2 offset 0 prefer

# Allow timing-monitor to query chrony locally.
bindcmdaddress 127.0.0.1
bindcmdaddress ::1
